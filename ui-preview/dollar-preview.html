  };
  window.fetch=mockFetch;
  Promise.all(['../cmd/codex-carpool/web/index.html','../cmd/codex-carpool/web/bootstrap.js','../cmd/codex-carpool/web/styles.css','../cmd/codex-carpool/web/app.js'].map(path=>nativeFetch(path,{cache:'no-store'}).then(response=>response.text()))).then(([page,bootstrap,styles,app])=>{

    // source into document.write made preview parsing sensitive to inline code.
    const previewParams=new URLSearchParams(location.search),previewLocale=previewParams.get('locale'),previewTheme=previewParams.get('theme');
    page=page.replaceAll('__CODEX_CARPOOL_VERSION__','preview').replace('<html lang="zh-CN">','<html lang="'+(previewLocale==='en'?'en-US':'zh-CN')+'"'+(previewTheme==='dark'?' data-theme="dark"':'')+'>').replace('</head>','<style>'+styles+'</style></head>');
    document.open();document.write(page);document.close();
    const bootstrapScript=document.createElement('script');bootstrapScript.text=bootstrap;document.head.append(bootstrapScript);
    const appScript=document.createElement('script');appScript.text=app;document.body.append(appScript);
