name: linux-build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Resolve and verify dependencies
        run: |
          go mod tidy
          go mod verify
      - name: Verify quota engine
        run: make test
      - name: Verify quota engine races
        run: make test-race
      - name: Vet plugin source
        run: go vet ./...
      - name: Build Linux native plugin
        run: make build
      - name: Package plugin archive
        run: make package VERSION=${GITHUB_REF_NAME#v}
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-carpool-linux-amd64
          path: dist/codex-carpool_*_linux_amd64.zip
